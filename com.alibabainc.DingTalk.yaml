id: com.alibabainc.DingTalk
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: dingtalk
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  # System tray icon
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Documents
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.*

  - --talk-name=org.freedesktop.DBus
  - --talk-name=org.freedesktop.DBus.Proprieties
  - --system-talk-name=org.freedesktop.DBus
  - --system-talk-name=org.freedesktop.DBus.Proprieties
  # Screenshot
  # - --talk-name=org.gnome.Shell.Screenshot
  # - --talk-name=org.kde.kwin.Screenshot
  # Files
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=/tmp
  # IME
  # - --env=QT_IM_MODULE=
  # Hidpi scale
  - --env=QT_AUTO_SCREEN_SCALE_FACTOR=1
  # Fix `Could not find the Qt platform plugin "wayland"`
  - --unset-env=QT_QPA_PLATFORM

cleanup:
  - "/include"
  - "/lib/pkgconfig"
  - "/man"
  - "/share/doc"
  - "/share/gtk-doc"
  - "/share/man"
  - "/share/pkgconfig"
  - "*.la"
  - "*.a"

modules:

  - name: libxcrypt
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app
      - make
      - make install
    sources:
      - type: archive
        url: https://github.com/besser82/libxcrypt/releases/download/v4.4.36/libxcrypt-4.4.36.tar.xz
        sha256: e5e1f4caee0a01de2aee26e3138807d6d3ca2b8e67287966d1fefd65e1fd8943
    cleanup:
      - /share/doc
      - /share/man

  - name: dingtalk
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
#      - install -D Elevator.sh $FLATPAK_DEST/bin/Elevator.sh
      - install -D dingtalk.sh $FLATPAK_DEST/bin/dingtalk
      - install -D dde-file-manager.sh $FLATPAK_DEST/bin/dde-file-manager
      - install -Dm644 com.alibabainc.DingTalk.metainfo.xml -t $FLATPAK_DEST/share/metainfo
      - install -Dm644 com.alibabainc.DingTalk.png -t $FLATPAK_DEST/share/icons/hicolor/256x256/apps
      - install -Dm644 com.alibabainc.DingTalk.desktop -t $FLATPAK_DEST/share/applications
    sources:      
      - type: script
        commands:
          - export LANG=en_US.UTF-8
          - export LC_ALL=en_US.UTF-8
          - bsdtar -O -xf dingtalk.deb data.* | bsdtar --no-same-owner -xf -
          - mkdir -p dingtalk/current_version
          - cp -R opt/apps/com.alibabainc.dingtalk/files/8.1.0-Release.6021101/* dingtalk/current_version/
          - cp opt/apps/com.alibabainc.dingtalk/files/version dingtalk/
          - cp opt/apps/com.alibabainc.dingtalk/files/logo.ico dingtalk/
          - rm -f dingtalk/current_version/libm.so.6
          - rm -f dingtalk/current_version/libstdc++.so.6
          - rm -rf dingtalk.deb usr opt
        dest-filename: apply_extra

      - type: file
        path: dingtalk.sh

      - type: file
        path: dde-file-manager.sh
      
      - type: file
        path: com.alibabainc.DingTalk.metainfo.xml

      - type: file
        path: com.alibabainc.DingTalk.png

      - type: file
        path: com.alibabainc.DingTalk.desktop

      - type: extra-data
        filename: dingtalk.deb
        only-arches: [x86_64]
        url: https://dtapp-pub.dingtalk.com/dingtalk-desktop/xc_dingtalk_update/linux_deb/Release/com.alibabainc.dingtalk_8.1.0.6021101_amd64.deb
        sha256: ec492f12feabece34702ea47e3cfc1a164ae2e8dabdee9b05e74a3a5e4de21d5
        size: 404869700
      
      - type: extra-data
        filename: dingtalk.deb
        only-arches: [aarch64]
        url: https://dtapp-pub.dingtalk.com/dingtalk-desktop/xc_dingtalk_update/linux_deb/Release/com.alibabainc.dingtalk_8.1.0.6021101_arm64.deb
        sha256: a7294d8bc2d672e48428f7295869815900c341867bbbd279b0eb172364287dd78bb21cedfb499efc3de63864617e0489d33c8a5ffb110d46d7d0871107d85372
        size: 405399416
